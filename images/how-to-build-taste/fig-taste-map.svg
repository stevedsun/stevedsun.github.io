<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:760px; height:auto; font-family:Arial, sans-serif; display:block; margin:0 auto;" role="img" aria-label="A two by two map. Horizontal axis is ability to tell good from bad, low to high. Vertical axis is point of view, consensus to authored. Bottom left is Derivative. Bottom right is Tasteful but generic, which is what AI gives you. Top left is Confident amateur. Top right is Signature, build here."><rect x="0" y="0" width="760" height="470" fill="#ffffff"></rect><text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">The Taste Map</text><text x="380" y="50" text-anchor="middle" font-size="12" fill="#6b7280">Only the top-right corner is out of the machine&#8217;s reach.</text><line x1="120" y1="90" x2="120" y2="410" stroke="#9ca3af" stroke-width="1.5"></line><line x1="120" y1="410" x2="700" y2="410" stroke="#9ca3af" stroke-width="1.5"></line><text x="105" y="250" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-90 105 250)" text-anchor="middle">Point of view: consensus to authored</text><text x="410" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Can you tell good from bad? low to high</text><rect x="130" y="250" width="270" height="150" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"></rect><text x="265" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b5563">Derivative</text><text x="265" y="337" text-anchor="middle" font-size="11" fill="#6b7280">no eye, no stance</text><text x="265" y="353" text-anchor="middle" font-size="11" fill="#6b7280">pure slop</text><rect x="410" y="250" width="280" height="150" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"></rect><text x="550" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Tasteful but generic</text><text x="550" y="332" text-anchor="middle" font-size="11" fill="#1d4ed8">good eye, no stance</text><text x="550" y="348" text-anchor="middle" font-size="11" fill="#1d4ed8">this is what AI gives you free</text><rect x="130" y="100" width="270" height="150" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"></rect><text x="265" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">Confident amateur</text><text x="265" y="187" text-anchor="middle" font-size="11" fill="#a16207">strong stance, weak eye</text><text x="265" y="203" text-anchor="middle" font-size="11" fill="#a16207">loud, but often wrong</text><rect x="410" y="100" width="280" height="150" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"></rect><text x="550" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">Signature</text><text x="550" y="184" text-anchor="middle" font-size="11" fill="#15803d">sharp eye AND a real stance</text><text x="550" y="200" text-anchor="middle" font-size="11" fill="#15803d">the machine cannot reach here</text><text x="550" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">BUILD HERE</text></svg>
