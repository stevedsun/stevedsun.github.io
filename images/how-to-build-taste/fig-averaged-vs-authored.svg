<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:760px; height:auto; font-family:Arial, sans-serif; display:block; margin:0 auto;" role="img" aria-label="A bell curve of quality. A dense cluster sits at the peak in the middle, labeled AI output and consensus taste, with a downward arrow labeled regression to the mean. A single marked dot sits far out on the right tail, labeled authored taste, your signature."><rect x="0" y="0" width="760" height="400" fill="#ffffff"></rect><text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">Averaged Taste vs Authored Taste</text><text x="380" y="50" text-anchor="middle" font-size="12" fill="#6b7280">AI clusters at the mean. Authored taste is a deliberate point out on the tail.</text><line x1="70" y1="330" x2="700" y2="330" stroke="#9ca3af" stroke-width="1.5"></line><path d="M 90,330 C 250,330 270,110 385,110 C 500,110 520,330 680,330" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"></path><rect x="340" y="110" width="90" height="220" fill="#dbeafe" opacity="0.7"></rect><text x="385" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">AI output</text><text x="385" y="218" text-anchor="middle" font-size="11" fill="#1d4ed8">consensus taste</text><text x="385" y="236" text-anchor="middle" font-size="11" fill="#1d4ed8">the good average</text><line x1="385" y1="66" x2="385" y2="104" stroke="#dc2626" stroke-width="2.5"></line><polygon points="385,110 378,94 392,94" fill="#dc2626"></polygon><text x="385" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">regression to the mean</text><circle cx="640" cy="300" r="8" fill="#16a34a" stroke="#166534" stroke-width="2"></circle><text x="640" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">authored taste</text><text x="640" y="268" text-anchor="middle" font-size="11" fill="#15803d">your signature</text><line x1="640" y1="292" x2="628" y2="322" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"></line><text x="150" y="360" text-anchor="middle" font-size="11" fill="#6b7280">rare / weird / wrong</text><text x="385" y="360" text-anchor="middle" font-size="11" fill="#6b7280">safe / competent / expected</text><text x="640" y="378" text-anchor="middle" font-size="11" fill="#6b7280">rare / specific / on purpose</text><text x="380" y="392" text-anchor="middle" font-size="10.5" fill="#9ca3af">Quality distribution. The middle is crowded now. The defensible move is a deliberate position off-center.</text></svg>
