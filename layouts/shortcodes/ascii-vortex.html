{{- /*
  ASCII 黑色漩涡动画 —— 首页头图。
  纯 JS 渲染到 <pre>，无外部依赖；文字用 currentColor，随主题深浅色自动适配。
  尊重 prefers-reduced-motion：只渲染一帧静态画面。
*/ -}}
<pre id="ascii-vortex" class="ascii-vortex" aria-hidden="true"></pre>
<style>
.ascii-vortex {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 11px;
  line-height: 1.1;
  text-align: center;
  overflow: hidden;
  margin: 0 auto 1em;
  user-select: none;
}
@media (max-width: 600px) {
  .ascii-vortex { font-size: 7px; }
}
</style>
<script>
(function () {
  var el = document.getElementById('ascii-vortex');
  if (!el) return;

  var COLS = 84, ROWS = 30;
  var CHARS = ' .·:-=+*#%@';
  var N = CHARS.length - 1;
  var HOLE = 2.6;  /* 视界半径（字符单位） */
  var ARMS = 4;    /* 旋臂数量 */

  function frame(t) {
    var out = new Array(ROWS);
    for (var y = 0; y < ROWS; y++) {
      var row = new Array(COLS);
      for (var x = 0; x < COLS; x++) {
        var cx = x - COLS / 2;
        var cy = (y - ROWS / 2) * 2.1; /* 字符高宽比校正 */
        var r = Math.sqrt(cx * cx + cy * cy);
        if (r < HOLE) {
          row[x] = '@';
          continue;
        }
        var a = Math.atan2(cy, cx);
        var swirl = Math.sin(a * ARMS - r * 0.55 + t * 1.6);
        var ripple = Math.sin(r * 1.3 - t * 2.2) * 0.25;
        var falloff = Math.exp(-(r - HOLE) * 0.055);
        var v = (0.5 + 0.5 * swirl + ripple) * falloff;
        if (v < 0) v = 0; else if (v > 1) v = 1;
        row[x] = CHARS[Math.round(v * N)];
      }
      out[y] = row.join('');
    }
    el.textContent = out.join('\n');
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    frame(1.7);
    return;
  }
  var last = 0;
  function loop(ts) {
    if (ts - last > 40) { last = ts; frame(ts / 1000); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
